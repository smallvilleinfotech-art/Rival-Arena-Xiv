<style>
  :root{
    --bg:#08080f;
    --panel:#12121e;
    --panel-2:#191927;
    --panel-3:#1f1f30;
    --border:#26263a;
    --gold:#f5b942;
    --gold-2:#ffd680;
    --purple:#7c3aed;
    --purple-2:#a855f7;
    --text:#f2f2f7;
    --muted:#8d8da3;
    --green:#3ddc97;
    --red:#ef4a6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.font-display{font-family:'Sora',sans-serif;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:8px;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;color:inherit;}
  select{font-family:inherit;color:var(--text);}
  ::placeholder{color:var(--muted);opacity:1;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary:disabled,.btn-gold:disabled{filter:none;}
  a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px;}
  .glow-gold{background:linear-gradient(135deg,var(--gold),var(--gold-2));}
  .glow-purple{background:linear-gradient(135deg,var(--purple),var(--purple-2));}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;color:var(--text);}
  .card button, button.card{color:var(--text);}
  .chip{background:var(--panel-2);border:1px solid var(--border);border-radius:999px;color:var(--text);}
  .text-muted{color:var(--muted);}
  .online-dot{width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid var(--panel);display:inline-block;}
  .tab-active{color:var(--gold);border-bottom:2px solid var(--gold);}
  .tab-inactive{color:var(--muted);border-bottom:2px solid transparent;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;color:var(--muted);font-weight:600;font-size:14px;}
  .nav-item:hover{background:var(--panel-2);color:var(--text);}
  .nav-item.active{background:linear-gradient(90deg,rgba(124,58,237,.25),transparent);color:var(--gold);border-left:3px solid var(--gold);}
  .btn-primary{background:linear-gradient(135deg,var(--purple),var(--purple-2));color:#fff;font-weight:700;border:none;border-radius:12px;padding:10px 18px;}
  .btn-primary:hover{filter:brightness(1.1);}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#1a1200;font-weight:700;border:none;border-radius:12px;padding:10px 18px;}
  .btn-ghost{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:10px 16px;font-weight:600;}
  .input{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);width:100%;outline:none;}
  .input:focus{border-color:var(--purple-2);}
  .badge-verified{color:var(--purple-2);}
  .avatar{border-radius:50%;object-fit:cover;background:var(--panel-3);}
  .skeleton{background:linear-gradient(90deg,var(--panel-2) 25%,var(--panel-3) 37%,var(--panel-2) 63%);background-size:400% 100%;animation:shimmer 1.4s infinite;}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
  .fade-in{animation:fadeIn .25s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  #toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:100;}
  @media (max-width:900px){ .sidebar{display:none;} .bottomnav{display:flex;} .maincontent{padding-bottom:90px;} }
  @media (max-width:760px){ #tab-content > div[style*="grid-template-columns:minmax(0,520px) 1fr"]{grid-template-columns:1fr !important;} }
  @media (min-width:901px){ .bottomnav{display:none;} }
</style>
</head>

function icon(name, size=18, extra=''){

function toast(msg, ok=true){
  const el = document.getElementById('toast');
  el.innerHTML = `<div class="fade-in" style="background:${ok?'var(--panel-2)':'#3a1010'};border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);">${msg}</div>`;

function fmtNum(n){
  n = Number(n)||0;
  if (n >= 1000000) return (n/1000000).toFixed(1)+'M';
  if (n >= 1000) return (n/1000).toFixed(1)+'K';
  return n.toString();
}
function fmtMoney(n){ return '₦'+fmtNum(n); }
function timeAgo(iso){
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if (s<60) return 'just now';
  if (s<3600) return Math.floor(s/60)+'m ago';
  if (s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function initials(name){ return (name||'?').slice(0,2).toUpperCase(); }
function avatarUrl(p){
  return p?.avatar_url || `https://api.dicebear.com/7.x/shapes/svg?seed=${encodeURIComponent(p?.username||'guest')}`;

  const bar = document.getElementById('bottomnav');
  bar.innerHTML = BOTTOM_ITEMS.map(id => {
    const it = NAV_ITEMS.find(n=>n.id===id);
    const isChallenge = id==='pro';
    if (isChallenge){
      return `<a href="#" onclick="setTab('pro');return false;" style="display:flex;flex-direction:column;align-items:center;gap:2px;">
        <div class="glow-purple" style="width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 6px 18px rgba(124,58,237,.5);">${icon('challenge',20,'style="color:#fff"')}</div>
        <span style="font-size:10px;color:${state.activeTab===id?'var(--gold)':'var(--muted)'};font-weight:600;">Challenge</span>
      </a>`;
    }
    return `<a href="#" onclick="setTab('${id}');return false;" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:${state.activeTab===id?'var(--gold)':'var(--muted)'};">
      ${icon(it.icon,20)}<span style="font-size:10px;font-weight:600;">${it.label}</span>
    </a>`;
  }).join('');
}

async function setTab(id){
  state.activeTab = id;
  renderSidebar(); renderBottomNav();
  const el = document.getElementById('tab-content');
  el.innerHTML = `<div class="skeleton" style="height:220px;border-radius:16px;"></div>`;
  const renderers = {
    feed: renderFeedTab, career: renderCareerTab, clubs: renderClubsTab,
    tournaments: renderTournamentsTab, rankings: renderRankingsTab,
    pro: renderProPlayersTab, shop: renderShopTab, inbox: renderInboxTab,
  };
  await (renderers[id] || renderFeedTab)();
}
window.setTab = setTab;

/* ==========================================================================
   4. AUTH
   ========================================================================== */
let authMode = 'signin';
document.getElementById('auth-toggle').onclick = (e) => {
  e.preventDefault();
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  const isSignup = authMode === 'signup';
  document.getElementById('auth-title').textContent = isSignup ? 'Create your career' : 'Welcome back';
  document.getElementById('auth-sub').textContent = isSignup ? 'Set up your Rival Arena profile' : 'Sign in to your career profile';
  document.getElementById('auth-username-wrap').style.display = isSignup ? 'block' : 'none';
  document.getElementById('auth-submit').textContent = isSignup ? 'Create Account' : 'Sign In';
  document.getElementById('auth-toggle-text').textContent = isSignup ? 'Already have a career?' : 'New to Rival Arena?';
  document.getElementById('auth-toggle').textContent = isSignup ? 'Sign in' : 'Create account';
  document.getElementById('auth-error').style.display = 'none';
};

document.getElementById('auth-submit').onclick = async () => {
  if (!sb) { toast('Configure Supabase first', false); return; }
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const username = document.getElementById('auth-username').value.trim();
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';
  if (!email || !password || (authMode==='signup' && !username)) {
    errEl.textContent = 'Please fill in all fields.'; errEl.style.display='block'; return;
  }
  const btn = document.getElementById('auth-submit');
  btn.textContent = 'Please wait…'; btn.disabled = true;
  try {
    if (authMode === 'signup') {
      const { data, error } = await sb.auth.signUp({
        email, password, options: { data: { username } }
      });
      if (error) throw error;
      if (data.user && !data.session) {
        toast('Check your email to confirm your account.');
      }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (e) {
    errEl.textContent = e.message || 'Something went wrong.';
    errEl.style.display = 'block';
  } finally {
    btn.textContent = authMode === 'signup' ? 'Create Account' : 'Sign In';
    btn.disabled = false;
  }
};

async function boot(){
  if (!sb) {
    document.getElementById('auth-screen').style.display = 'flex';
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if (session) { await onLoggedIn(session.user); }
  else { document.getElementById('auth-screen').style.display = 'flex'; }

  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session) { await onLoggedIn(session.user); }
    if (event === 'SIGNED_OUT') {
      document.getElementById('app').style.display = 'none';
      document.getElementById('auth-screen').style.display = 'flex';
    }
  });
}

async function onLoggedIn(user){
  state.user = user;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  await loadProfile();
  await loadUnreadCount();
  await loadFollowing();
  renderSidebar(); renderBottomNav();
  await setTab('feed');
  subscribeRealtime();
}

async function loadProfile(){
  let { data, error } = await sb.from('profiles').select('*').eq('id', state.user.id).single();
  if (error || !data) {
    // fallback: create profile client-side if trigger hasn't fired yet
    const username = state.user.user_metadata?.username || state.user.email.split('@')[0];
    const { data: created } = await sb.from('profiles').insert({ id: state.user.id, username }).select().single();
    data = created;
  }
  state.profile = data;
  state.profilesById[data.id] = data;
  renderProfileBar();
}

function renderProfileBar(){
  const p = state.profile;
  if (!p) return;
  document.getElementById('profile-avatar').src = avatarUrl(p);
  document.getElementById('profile-ovr-badge').textContent = p.ovr;
  document.getElementById('profile-username').textContent = p.username;
  document.getElementById('profile-verified').style.display = p.verified ? 'inline' : 'none';
  document.getElementById('profile-position').textContent = `${p.ovr} OVR • ${p.position}`;
  document.getElementById('profile-coins').textContent = fmtNum(p.coins);
  document.getElementById('stat-rank').textContent = p.rank;
  document.getElementById('stat-streak').textContent = p.win_streak;
  document.getElementById('stat-fans').textContent = fmtNum(p.fans);
  document.getElementById('stat-market').textContent = fmtMoney(p.market_value);
}

async function loadUnreadCount(){
  const { count } = await sb.from('notifications').select('id', { count:'exact', head:true }).eq('user_id', state.user.id).eq('is_read', false);
  state.notifUnread = count || 0;
}

async function loadFollowing(){
  const { data } = await sb.from('follows').select('following_id').eq('follower_id', state.user.id);
  state.followingIds = new Set((data||[]).map(f=>f.following_id));
}

async function getFollowCounts(profileId){
  const [{ count: followers }, { count: following }] = await Promise.all([
    sb.from('follows').select('id', { count:'exact', head:true }).eq('following_id', profileId),
    sb.from('follows').select('id', { count:'exact', head:true }).eq('follower_id', profileId),
  ]);
  state.followerCounts[profileId] = followers || 0;
  state.followingCounts[profileId] = following || 0;
  return { followers: followers||0, following: following||0 };
}

async function toggleFollow(targetId){
  if (targetId === state.user.id) return;
  const isFollowing = state.followingIds.has(targetId);
  if (isFollowing){
    await sb.from('follows').delete().eq('follower_id', state.user.id).eq('following_id', targetId);
    state.followingIds.delete(targetId);
    toast('Unfollowed');
  } else {
    const { error } = await sb.from('follows').insert({ follower_id: state.user.id, following_id: targetId });
    if (error) { toast(error.message, false); return; }
    state.followingIds.add(targetId);
    toast('Now following ✅');
    await sb.from('notifications').insert({ user_id: targetId, title:'New follower', body:`${state.profile.username} started following you.`, type:'system' });
  }
  // refresh whatever tab is showing player cards
  if (['pro','rankings'].includes(state.activeTab)) {
    const renderers = { pro: renderProPlayersTab, rankings: renderRankingsTab };
    await renderers[state.activeTab]();
  }
  const modalFollowBtn = document.getElementById(`modal-follow-btn-${targetId}`);
  if (modalFollowBtn) openProfileModal(targetId); // re-render modal with fresh state
}
window.toggleFollow = toggleFollow;

/* ---- Player profile modal ---- */
async function openProfileModal(profileId){
  const modal = document.getElementById('profile-modal');
  const body = document.getElementById('profile-modal-body');
  modal.style.display = 'flex';
  body.innerHTML = `<div class="skeleton" style="height:220px;border-radius:14px;"></div>`;
  delete state.profilesById[profileId]; // always show fresh stats in the modal
  await fetchProfilesByIds([profileId]);
  const p = state.profilesById[profileId];
  if (!p) { body.innerHTML = `<p class="text-muted">Player not found.</p>`; return; }
  const { followers, following } = await getFollowCounts(profileId);
  const isMe = profileId === state.user.id;
  const isFollowing = state.followingIds.has(profileId);
  body.innerHTML = `
    <div style="display:flex;justify-content:flex-end;"><button onclick="closeProfileModal()" style="background:none;border:none;color:var(--muted);font-size:20px;line-height:1;">✕</button></div>
    <div style="text-align:center;">
      <img class="avatar" src="${avatarUrl(p)}" style="width:84px;height:84px;border:3px solid var(--gold);margin:0 auto 10px;"/>
      <div style="font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;gap:6px;">${p.username} ${p.verified?'✔️':''}</div>
      <div class="text-muted" style="font-size:11px;font-weight:600;letter-spacing:.03em;">${p.rival_id||''}</div>
      ${p.full_name?`<div class="text-muted" style="font-size:13px;margin-top:2px;">${escapeHtml(p.full_name)}</div>`:''}
      <div class="text-muted" style="font-size:12px;margin-top:2px;">${[p.position, p.country].filter(Boolean).join(' • ')}</div>
      ${p.bio?`<p style="font-size:13px;margin-top:10px;">${escapeHtml(p.bio)}</p>`:''}
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0;">
      <div class="chip" style="padding:8px;text-align:center;"><div style="font-weight:800;color:var(--gold);">${p.ovr}</div><div class="text-muted" style="font-size:10px;">OVR</div></div>
      <div class="chip" style="padding:8px;text-align:center;"><div style="font-weight:800;">#${p.rank}</div><div class="text-muted" style="font-size:10px;">Rank</div></div>
      <div class="chip" style="padding:8px;text-align:center;"><div style="font-weight:800;">${p.wins}-${p.draws}-${p.losses}</div><div class="text-muted" style="font-size:10px;">W-D-L</div></div>
      <div class="chip" style="padding:8px;text-align:center;"><div style="font-weight:800;">${fmtNum(followers)}</div><div class="text-muted" style="font-size:10px;">Followers</div></div>
    </div>
    ${!isMe ? `
      <div style="display:flex;gap:8px;">
        <button id="modal-follow-btn-${p.id}" class="${isFollowing?'btn-ghost':'btn-primary'}" style="flex:1;" onclick="toggleFollow('${p.id}')">${isFollowing?'Following ✓':'Follow'}</button>
        <button class="btn-gold" style="flex:1;" onclick="closeProfileModal(); setTab('pro');" >Challenge</button>
      </div>` : `<button class="btn-ghost" style="width:100%;" onclick="closeProfileModal(); setTab('career');">Edit My Career</button>`}
  `;
}
function closeProfileModal(){ document.getElementById('profile-modal').style.display = 'none'; }
window.openProfileModal = openProfileModal;
window.closeProfileModal = closeProfileModal;

function logout(){
  state.channels.forEach(ch => sb.removeChannel(ch));
  state.channels = [];
  sb.auth.signOut();
}
window.logout = logout;

async function fetchProfilesByIds(ids){
  const missing = [...new Set(ids)].filter(id => !state.profilesById[id]);
  if (missing.length){
    const { data } = await sb.from('profiles').select('*').in('id', missing);
    (data||[]).forEach(p => state.profilesById[p.id] = p);
  }
}

function setFeedFilter(f){ state.feedFilter = f; renderFeedTab(); }
window.setFeedFilter = setFeedFilter;

async function loadFeed(){
  const listEl = document.getElementById('feed-list');
  listEl.innerHTML = `<div class="skeleton" style="height:140px;border-radius:16px;margin-bottom:12px;"></div>`.repeat(3);

  if (state.feedFilter === 'Following' && state.followingIds.size === 0) {
    listEl.innerHTML = `<div class="card" style="padding:28px;text-align:center;">
      <div style="font-size:26px;margin-bottom:8px;">👥</div>
      <div style="font-weight:700;">You're not following anyone yet</div>
      <div class="text-muted" style="font-size:13px;margin-top:4px;">Follow players from Rankings or Pro Players to see their posts here.</div>
      <button class="btn-primary" style="margin-top:12px;" onclick="setTab('rankings')">Browse Rankings</button>
    </div>`;
    return;
  }

  let query = sb.from('posts').select('*').order('created_at', { ascending:false }).limit(50);
  if (state.feedFilter === 'Following') {
    query = query.in('author_id', [...state.followingIds]);
  } else if (state.feedFilter !== 'All') {
    query = query.eq('category', state.feedFilter);
  }
  const { data: posts, error } = await query;
  if (error) { listEl.innerHTML = `<p class="text-muted">Couldn't load feed: ${error.message}</p>`; return; }
  if (!posts || !posts.length) { listEl.innerHTML = `<div class="card" style="padding:24px;text-align:center;" class="text-muted">No posts yet. Be the first to share something.</div>`; return; }

  await fetchProfilesByIds(posts.map(p=>p.author_id));
  const postIds = posts.map(p=>p.id);
  const { data: likes } = await sb.from('post_likes').select('post_id,user_id').in('post_id', postIds);
  const { data: comments } = await sb.from('post_comments').select('id,post_id').in('post_id', postIds);

  const likeCounts = {}, userLiked = {}, commentCounts = {};
  (likes||[]).forEach(l => { likeCounts[l.post_id]=(likeCounts[l.post_id]||0)+1; if(l.user_id===state.user.id) userLiked[l.post_id]=true; });
  (comments||[]).forEach(c => { commentCounts[c.post_id]=(commentCounts[c.post_id]||0)+1; });

  listEl.innerHTML = posts.map(post => {
    const author = state.profilesById[post.author_id] || {};
    return `
    <div class="card fade-in" style="padding:16px;margin-bottom:14px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer;" onclick="openProfileModal('${post.author_id}')">
        <img class="avatar" src="${avatarUrl(author)}" style="width:40px;height:40px;"/>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span style="font-weight:700;font-size:14px;">${author.username||'Unknown'}</span>
            ${author.verified?`<span style="color:var(--purple-2);">${icon('bell'.replace('bell','feed'),0)}</span>`:''}
            ${author.verified?`<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="color:var(--purple-2)"><circle cx="12" cy="12" r="10"/></svg>`:''}
            ${post.badge_label?`<span class="chip" style="font-size:10px;padding:2px 8px;font-weight:700;color:var(--gold);">${post.badge_label}</span>`:''}
          </div>
          <div style="color:var(--muted);font-size:12px;">${timeAgo(post.created_at)}</div>
        </div>
      </div>
      <p style="font-size:14px;line-height:1.5;white-space:pre-wrap;margin:0 0 10px;">${escapeHtml(post.content)}</p>
      ${post.image_url ? `<img src="${post.image_url}" style="width:100%;border-radius:12px;margin-bottom:10px;max-height:320px;object-fit:cover;"/>` : ''}
      <div style="display:flex;gap:20px;color:var(--muted);font-size:13px;border-top:1px solid var(--border);padding-top:10px;">
        <button onclick="toggleLike('${post.id}')" style="background:none;border:none;display:flex;align-items:center;gap:6px;color:${userLiked[post.id]?'var(--red)':'var(--muted)'};font-weight:600;">
          ${icon('heart',16)} <span id="like-count-${post.id}">${fmtNum(likeCounts[post.id]||0)}</span>
        </button>
        <button onclick="toggleComments('${post.id}')" style="background:none;border:none;display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;">
          ${icon('comment',16)} <span id="comment-count-${post.id}">${fmtNum(commentCounts[post.id]||0)}</span>
        </button>
        <button onclick="navigator.clipboard && navigator.clipboard.writeText(window.location.href); toast('Link copied to share 🔗')" style="background:none;border:none;display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;">
          ${icon('share',16)} Share
        </button>
      </div>
      <div id="comments-${post.id}" style="display:none;margin-top:10px;"></div>
    </div>`;
  }).join('');
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function createPost(){
  const textEl = document.getElementById('new-post-text');
  const content = textEl.value.trim();
  if (!content) { toast('Write something first', false); return; }
  const { error } = await sb.from('posts').insert({
    author_id: state.user.id, content, category: state.feedFilter==='Following'?'All':state.feedFilter
  });
  if (error) { toast(error.message, false); return; }
  textEl.value = '';
  toast('Posted ✅');
  await loadFeed();
}
window.createPost = createPost;

async function toggleLike(postId){
  const { data: existing } = await sb.from('post_likes').select('id').eq('post_id', postId).eq('user_id', state.user.id).maybeSingle();
  if (existing) {
    await sb.from('post_likes').delete().eq('id', existing.id);
  } else {
    await sb.from('post_likes').insert({ post_id: postId, user_id: state.user.id });
  }
  await loadFeed();
}
window.toggleLike = toggleLike;

async function toggleComments(postId){
  const box = document.getElementById(`comments-${postId}`);
  if (box.style.display === 'block') { box.style.display = 'none'; return; }
  box.style.display = 'block';
  box.innerHTML = `<div class="skeleton" style="height:40px;border-radius:8px;"></div>`;
  const { data: comments } = await sb.from('post_comments').select('*').eq('post_id', postId).order('created_at');
  await fetchProfilesByIds((comments||[]).map(c=>c.user_id));
  box.innerHTML = `
    <div style="border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:8px;">
      ${(comments||[]).map(c => `
        <div style="display:flex;gap:8px;">
          <img class="avatar" src="${avatarUrl(state.profilesById[c.user_id])}" style="width:26px;height:26px;"/>
          <div class="chip" style="padding:6px 12px;flex:1;">
            <div style="font-size:12px;font-weight:700;">${state.profilesById[c.user_id]?.username||'User'}</div>
            <div style="font-size:13px;">${escapeHtml(c.content)}</div>
          </div>
        </div>`).join('') || `<div style="color:var(--muted);font-size:13px;">No comments yet.</div>`}
      <div style="display:flex;gap:8px;margin-top:4px;">
        <input class="input" id="comment-input-${postId}" placeholder="Add a comment…" style="font-size:13px;"/>
        <button class="btn-ghost" onclick="addComment('${postId}')">Send</button>
      </div>
    </div>`;
}
window.toggleComments = toggleComments;

async function addComment(postId){
  const input = document.getElementById(`comment-input-${postId}`);
  const content = input.value.trim();
  if (!content) return;
  const { error } = await sb.from('post_comments').insert({ post_id: postId, user_id: state.user.id, content });
  if (error) { toast(error.message, false); return; }
  input.value = '';
  await toggleComments(postId); await toggleComments(postId);
  await loadFeed();
}
window.addComment = addComment;

async function toggleJoinTournament(tournamentId, isJoined){
  if (isJoined){
    await sb.from('tournament_participants').delete().eq('tournament_id', tournamentId).eq('user_id', state.user.id);
    toast('Left tournament');
  } else {
    const t = (await sb.from('tournaments').select('entry_fee').eq('id', tournamentId).single()).data;
    if (t && t.entry_fee > state.profile.coins){ toast('Not enough coins for entry fee', false); return; }
    const { error } = await sb.from('tournament_participants').insert({ tournament_id: tournamentId, user_id: state.user.id });
    if (error) { toast(error.message, false); return; }
    if (t && t.entry_fee > 0){
      const newCoins = state.profile.coins - t.entry_fee;
      await sb.from('profiles').update({ coins:newCoins }).eq('id', state.user.id);
      state.profile.coins = newCoins; renderProfileBar();
    }
    toast('Joined tournament 🏆');
  }
  await renderTournamentsTab();
}
window.toggleJoinTournament = toggleJoinTournament;

function renderMyMatches(matches){
  const box = document.getElementById('my-matches');
  if (!matches.length) { box.innerHTML = ''; return; }
  const active = matches.filter(m => m.status !== 'confirmed');
  const recent = matches.filter(m => m.status === 'confirmed').slice(0, 5);

  const matchRow = (m) => {
    const isA = m.player_a === state.user.id;
    const me = isA ? m.player_a : m.player_b;
    const rival = isA ? m.player_b : m.player_a;
    const rivalName = state.profilesById[rival]?.username || 'Rival';

    if (m.status === 'awaiting_result') {
      return `<div class="card" style="padding:14px 16px;margin-bottom:8px;">
        <div style="font-size:13px;margin-bottom:8px;">vs <b>${rivalName}</b> ${m.wager_coins?`<span class="text-muted">• ${fmtNum(m.wager_coins)} coin wager</span>`:''}</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <input class="input" type="number" min="0" placeholder="Your score" id="my-score-${m.id}" style="width:110px;font-size:12px;padding:6px 10px;"/>
          <span class="text-muted" style="font-size:12px;">–</span>
          <input class="input" type="number" min="0" placeholder="Rival score" id="rival-score-${m.id}" style="width:110px;font-size:12px;padding:6px 10px;"/>
          <button class="btn-gold" style="padding:6px 14px;font-size:12px;" onclick="submitMatchResult('${m.id}','${me}','${rival}')">Submit Result</button>
        </div>
      </div>`;
    }
    if (m.status === 'awaiting_confirmation') {
      const iSubmitted = m.submitted_by === state.user.id;
      const myScore = isA ? m.score_a : m.score_b;
      const rivalScore = isA ? m.score_b : m.score_a;
      if (iSubmitted) {
        return `<div class="card" style="padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <span style="font-size:13px;">vs <b>${rivalName}</b> — you reported <b>${myScore}-${rivalScore}</b></span>
          <span class="chip" style="font-size:11px;padding:2px 10px;color:var(--gold);">Waiting for rival to confirm</span>
        </div>`;
      }
      return `<div class="card" style="padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <span style="font-size:13px;"><b>${rivalName}</b> reported <b>${rivalScore}-${myScore}</b> (them-you)</span>
        <div style="display:flex;gap:6px;">
          <button class="btn-gold" style="padding:6px 12px;font-size:12px;" onclick="confirmMatchResult('${m.id}', true)">Confirm</button>
          <button class="btn-ghost" style="padding:6px 12px;font-size:12px;" onclick="confirmMatchResult('${m.id}', false)">Dispute</button>
        </div>
      </div>`;
    }
    return '';
  };

  const recentRow = (m) => {
    const isA = m.player_a === state.user.id;
    const rival = isA ? m.player_b : m.player_a;
    const rivalName = state.profilesById[rival]?.username || 'Rival';
    const myScore = isA ? m.score_a : m.score_b;
    const rivalScore = isA ? m.score_b : m.score_a;
    const outcome = myScore > rivalScore ? 'W' : myScore < rivalScore ? 'L' : 'D';
    const color = outcome==='W' ? 'var(--green)' : outcome==='L' ? 'var(--red)' : 'var(--muted)';
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;">
      <span>vs ${rivalName}</span>
      <span><b>${myScore}-${rivalScore}</b> <span style="color:${color};font-weight:800;">${outcome}</span></span>
    </div>`;
  };

  box.innerHTML = `
    ${active.length ? `<div style="margin-bottom:10px;">
      <div class="text-muted" style="font-size:13px;margin-bottom:6px;">My Matches</div>
      ${active.map(matchRow).join('')}
    </div>` : ''}
    ${recent.length ? `<details class="card" style="padding:12px 16px;">
      <summary style="cursor:pointer;font-size:13px;font-weight:700;">Recent results</summary>
      <div style="margin-top:8px;">${recent.map(recentRow).join('')}</div>
    </details>` : ''}
  `;
}

async function submitMatchResult(matchId, meId, rivalId){
  const myScoreEl = document.getElementById(`my-score-${matchId}`);
  const rivalScoreEl = document.getElementById(`rival-score-${matchId}`);
  const myScore = parseInt(myScoreEl.value);
  const rivalScore = parseInt(rivalScoreEl.value);
  if (isNaN(myScore) || isNaN(rivalScore) || myScore < 0 || rivalScore < 0) { toast('Enter both scores', false); return; }

  // matches store score_a/score_b tied to player_a/player_b, not "me/rival" — map correctly
  const { data: match } = await sb.from('matches').select('player_a').eq('id', matchId).single();
  const iAmA = match?.player_a === state.user.id;
  const score_a = iAmA ? myScore : rivalScore;
  const score_b = iAmA ? rivalScore : myScore;

  const { error } = await sb.rpc('submit_match_result', { p_match_id: matchId, p_score_a: score_a, p_score_b: score_b });
  if (error) { toast(error.message, false); return; }
  toast('Result submitted — waiting for your rival to confirm');
  await renderProPlayersTab();
}
window.submitMatchResult = submitMatchResult;

async function confirmMatchResult(matchId, agree){
  const { error } = await sb.rpc('confirm_match_result', { p_match_id: matchId, p_agree: agree });
  if (error) { toast(error.message, false); return; }
  toast(agree ? 'Match confirmed — stats updated 🏆' : 'Result disputed — your rival can resubmit');
  await renderProPlayersTab();
  await loadProfile();
}
window.confirmMatchResult = confirmMatchResult;

function renderPendingChallenges(list){
  const box = document.getElementById('pending-challenges');
  const incoming = list.filter(c=>c.opponent_id===state.user.id && c.status==='pending');
  const outgoing = list.filter(c=>c.challenger_id===state.user.id);
  box.innerHTML = `
    ${incoming.length ? `<div style="margin-bottom:12px;">
      <div class="text-muted" style="font-size:13px;margin-bottom:6px;">Incoming challenges</div>
      ${incoming.map(c=>`
        <div class="card" style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:13px;"><b>${state.profilesById[c.challenger_id]?.username}</b> challenged you${c.wager_coins?` for ${fmtNum(c.wager_coins)} coins`:''}</span>
          <div style="display:flex;gap:6px;">
            <button class="btn-gold" style="padding:6px 12px;font-size:12px;" onclick="respondChallenge('${c.id}','accepted')">Accept</button>
            <button class="btn-ghost" style="padding:6px 12px;font-size:12px;" onclick="respondChallenge('${c.id}','declined')">Decline</button>
          </div>
        </div>`).join('')}
    </div>` : ''}
    ${outgoing.length ? `<div>
      <div class="text-muted" style="font-size:13px;margin-bottom:6px;">Your sent challenges</div>
      ${outgoing.map(c=>`
        <div class="card" style="padding:10px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;">
          <span>vs <b>${state.profilesById[c.opponent_id]?.username}</b></span>
          <span class="chip" style="font-size:11px;padding:2px 8px;color:${c.status==='accepted'?'var(--green)':c.status==='declined'?'var(--red)':'var(--gold)'};">${c.status}</span>
        </div>`).join('')}
    </div>`:''}
  `;
}
async function sendChallenge(opponentId){
  const wagerInput = document.getElementById(`wager-${opponentId}`);
  const wager = parseInt(wagerInput.value)||0;
  if (wager > state.profile.coins) { toast('Not enough coins for that wager', false); return; }
  const { error } = await sb.from('challenges').insert({ challenger_id: state.user.id, opponent_id: opponentId, wager_coins: wager });
  if (error) { toast(error.message, false); return; }
  await sb.from('notifications').insert({ user_id: opponentId, title:'New 1v1 Challenge', body:`${state.profile.username} challenged you${wager?` for ${wager} coins`:''}.`, type:'challenge' });
  toast('Challenge sent ⚔️');
  await renderProPlayersTab();
}
window.sendChallenge = sendChallenge;

async function respondChallenge(challengeId, status){
  const { data, error } = await sb.from('challenges').update({ status, resolved_at: new Date().toISOString() }).eq('id', challengeId).select().single();
  if (error) { toast(error.message, false); return; }
  if (status === 'accepted' && data) {
    // opponent (current user) is accepting — create the match record the two will play
    const { error: matchErr } = await sb.from('matches').insert({
      challenge_id: data.id,
      player_a: data.challenger_id,
      player_b: data.opponent_id,
      wager_coins: data.wager_coins || 0,
    });
    if (matchErr) toast(matchErr.message, false);
    await sb.from('notifications').insert({ user_id: data.challenger_id, title:'Challenge accepted', body:`${state.profile.username} accepted your challenge. Play it out, then submit the score.`, type:'challenge' });
  }
  toast(status === 'accepted' ? 'Challenge accepted 🔥' : 'Challenge declined');
  await renderProPlayersTab();
}
window.respondChallenge = respondChallenge;

/* ==========================================================================
   11. SHOP TAB
   ========================================================================== */
async function renderShopTab(){
  const el = document.getElementById('tab-content');
  const { data: items } = await sb.from('shop_items').select('*').order('price_coins');
  el.innerHTML = `<h2 class="font-display" style="margin:0 0 14px;">Shop</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;">
    ${(items||[]).map(it => `
      <div class="card fade-in" style="padding:16px;display:flex;flex-direction:column;justify-content:space-between;">
        <div>
          <span class="chip" style="font-size:10px;padding:2px 8px;color:var(--purple-2);">${it.category}</span>
          <div style="font-weight:700;margin-top:8px;">${it.name}</div>
          <div style="color:var(--muted);font-size:12px;margin-top:4px;">${it.description||''}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;">
          <span style="color:var(--gold);font-weight:700;">● ${fmtNum(it.price_coins)}</span>
          <button class="btn-gold" style="padding:6px 14px;font-size:12px;" onclick="buyItem('${it.id}', ${it.price_coins})">Buy</button>
        </div>
      </div>`).join('')}
    </div>`;
}
async function buyItem(itemId, price){
  if (price > state.profile.coins) { toast('Not enough coins', false); return; }
  const { error } = await sb.from('purchases').insert({ user_id: state.user.id, item_id: itemId });
  if (error) { toast(error.message, false); return; }
  const newCoins = state.profile.coins - price;
  await sb.from('profiles').update({ coins:newCoins }).eq('id', state.user.id);
  state.profile.coins = newCoins; renderProfileBar();
  toast('Purchase complete ✅');
}
window.buyItem = buyItem;

/* ==========================================================================
   12. INBOX TAB
   ========================================================================== */
async function renderInboxTab(){
  const el = document.getElementById('tab-content');
  const { data: notifs } = await sb.from('notifications').select('*').eq('user_id', state.user.id).order('created_at', { ascending:false });
  el.innerHTML = `<h2 class="font-display" style="margin:0 0 14px;">Inbox</h2>
    <div style="display:flex;flex-direction:column;gap:10px;">
    ${(notifs||[]).map(n => `
      <div class="card fade-in" style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;${n.is_read?'opacity:.6;':''}">
        <div>
          <div style="font-weight:700;font-size:13px;">${n.title}</div>
          <div style="color:var(--muted);font-size:12px;margin-top:2px;">${n.body||''}</div>
          <div style="color:var(--muted);font-size:11px;margin-top:4px;">${timeAgo(n.created_at)}</div>
        </div>
        ${!n.is_read ? `<button class="btn-ghost" style="padding:5px 10px;font-size:11px;" onclick="markRead('${n.id}')">Mark read</button>` : ''}
      </div>`).join('') || `<div class="card" style="padding:24px;text-align:center;color:var(--muted);">No messages yet.</div>`}
    </div>`;

}
async function markRead(id){
  await sb.from('notifications').update({ is_read:true }).eq('id', id);
  await renderInboxTab();
}
window.markRead = markRead;

/* ==========================================================================
   13. REALTIME — keeps every tab live without manual refresh
   ========================================================================== */
function debounce(fn, ms){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), ms); };
}

function subscribeRealtime(){
  if (!sb || !state.user) return;
  state.channels.forEach(ch => sb.removeChannel(ch));
  state.channels = [];

  const refreshIfActive = debounce(async (tabIds) => {
    if (tabIds.includes(state.activeTab)) {
      const renderers = {
        feed: loadFeed, career: renderCareerTab, clubs: renderClubsTab,
        tournaments: renderTournamentsTab, rankings: renderRankingsTab,
        pro: renderProPlayersTab, shop: renderShopTab, inbox: renderInboxTab,
      };
      await renderers[state.activeTab]();
    }
  }, 350);

  // --- notifications: only mine ---
  const notifCh = sb.channel('rt-notifications')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'notifications', filter:`user_id=eq.${state.user.id}` }, (payload) => {
      state.notifUnread += 1;
      renderSidebar(); renderBottomNav();
      toast(`🔔 ${payload.new.title}`);
      refreshIfActive(['inbox']);
    })
    .subscribe();
  state.channels.push(notifCh);

  // --- challenges: incoming + outgoing ---
  const challengeCh = sb.channel('rt-challenges')
    .on('postgres_changes', { event:'*', schema:'public', table:'challenges', filter:`opponent_id=eq.${state.user.id}` }, () => refreshIfActive(['pro']))
    .on('postgres_changes', { event:'*', schema:'public', table:'challenges', filter:`challenger_id=eq.${state.user.id}` }, () => refreshIfActive(['pro']))
    .subscribe();
  state.channels.push(challengeCh);

  // --- matches: submit / confirm / dispute, live for both participants ---
  const matchesCh = sb.channel('rt-matches')
    .on('postgres_changes', { event:'*', schema:'public', table:'matches', filter:`player_a=eq.${state.user.id}` }, async () => { await loadProfile(); refreshIfActive(['pro']); })
    .on('postgres_changes', { event:'*', schema:'public', table:'matches', filter:`player_b=eq.${state.user.id}` }, async () => { await loadProfile(); refreshIfActive(['pro']); })
    .subscribe();
  state.channels.push(matchesCh);

  // --- achievements: toast the moment one unlocks ---
  const achCh = sb.channel('rt-achievements')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'player_achievements', filter:`player_id=eq.${state.user.id}` }, async (payload) => {
      const { data: ach } = await sb.from('achievements').select('*').eq('id', payload.new.achievement_id).single();
      if (ach) toast(`🏆 Achievement unlocked: ${ach.name}`);
      refreshIfActive(['career']);
    })
    .subscribe();
  state.channels.push(achCh);

  // --- feed: posts, likes, comments (global — feed is a shared space) ---
  const feedCh = sb.channel('rt-feed')
    .on('postgres_changes', { event:'*', schema:'public', table:'posts' }, () => refreshIfActive(['feed']))
    .on('postgres_changes', { event:'*', schema:'public', table:'post_likes' }, () => refreshIfActive(['feed']))
    .on('postgres_changes', { event:'*', schema:'public', table:'post_comments' }, () => refreshIfActive(['feed']))
    .subscribe();
  state.channels.push(feedCh);

  // --- tournaments ---
  const tourneyCh = sb.channel('rt-tournaments')
    .on('postgres_changes', { event:'*', schema:'public', table:'tournament_participants' }, () => refreshIfActive(['tournaments']))
    .on('postgres_changes', { event:'*', schema:'public', table:'tournaments' }, () => refreshIfActive(['tournaments']))
    .subscribe();
  state.channels.push(tourneyCh);

  // --- social graph: follows + live rank/coin/fan changes on any profile ---
  const socialCh = sb.channel('rt-social')
    .on('postgres_changes', { event:'*', schema:'public', table:'follows' }, async () => {
      await loadFollowing();
      refreshIfActive(['pro','rankings']);
    })
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'profiles' }, (payload) => {
      state.profilesById[payload.new.id] = payload.new;
      if (payload.new.id === state.user.id) { state.profile = payload.new; renderProfileBar(); }
      refreshIfActive(['rankings','clubs']);
    })
    .subscribe();
  state.channels.push(socialCh);
}

/* ==========================================================================
   14. AVATAR UPLOAD
   ========================================================================== */
function triggerAvatarUpload(){ document.getElementById('avatar-file-input').click(); }
window.triggerAvatarUpload = triggerAvatarUpload;

async function handleAvatarUpload(e){
  const file = e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('Please choose an image file', false); return; }
  if (file.size > 5 * 1024 * 1024) { toast('Image must be under 5MB', false); return; }

  toast('Uploading photo…');
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${state.user.id}/avatar.${ext}`;
  const { error: upErr } = await sb.storage.from('avatars').upload(path, file, { upsert: true, cacheControl: '3600' });
  if (upErr) { toast(upErr.message, false); return; }

  const { data: pub } = sb.storage.from('avatars').getPublicUrl(path);
  const avatar_url = `${pub.publicUrl}?t=${Date.now()}`; // cache-bust
  const { data, error } = await sb.from('profiles').update({ avatar_url }).eq('id', state.user.id).select().single();
  if (error) { toast(error.message, false); return; }

  state.profile = data; state.profilesById[data.id] = data;
  renderProfileBar();
  const preview = document.getElementById('career-avatar-preview');
  if (preview) preview.src = avatar_url;
  toast('Profile photo updated ✅');
  e.target.value = '';
}
window.handleAvatarUpload = handleAvatarUpload;

/* ==========================================================================
   BOOT
   ========================================================================== */
boot();
</script>
